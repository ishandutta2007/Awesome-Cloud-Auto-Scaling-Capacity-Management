<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Gradient for Dynamic Scaling Curve -->
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Stroke Gradient -->
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #38bdf8; }
    
    /* Subtle Dynamic Animations */
    @keyframes pulse-wave {
      0% { transform: scaleY(0.98); opacity: 0.7; }
      50% { transform: scaleY(1.02); opacity: 1; }
      100% { transform: scaleY(0.98); opacity: 0.7; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -80; }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    
    .dynamic-curve {
      animation: pulse-wave 4s ease-in-out infinite;
      transform-origin: center;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dash 3s linear infinite;
    }
    .node-1 { animation: float-node 3.5s ease-in-out infinite; }
    .node-2 { animation: float-node 4.2s ease-in-out infinite 0.5s; }
    .node-3 { animation: float-node 3.8s ease-in-out infinite 1s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="12" fill="url(#bg-grad)"/>
  <rect width="1200" height="320" rx="12" fill="url(#grid)"/>

  <!-- Background Dynamic Scaling Graph (Behind text to keep foreground readable) -->
  <g class="dynamic-curve" opacity="0.35">
    <!-- Area under graph -->
    <path d="M 50,260 Q 200,240 350,180 T 650,210 T 950,120 T 1150,160 L 1150,280 L 50,280 Z" fill="url(#curve-grad)"/>
    <!-- Graph Line -->
    <path d="M 50,260 Q 200,240 350,180 T 650,210 T 950,120 T 1150,160" fill="none" stroke="url(#stroke-grad)" stroke-width="3"/>
  </g>

  <!-- Floating Infra Nodes (Background Accent Elements) -->
  <g opacity="0.4">
    <!-- Node 1 -->
    <g class="node-1" transform="translate(920, 60)">
      <rect width="180" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="6" fill="#10b981"/>
      <text x="40" y="28" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">KEDA Scaler : Active</text>
    </g>

    <!-- Node 2 -->
    <g class="node-2" transform="translate(960, 140)">
      <rect width="190" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="6" fill="#3b82f6"/>
      <text x="40" y="28" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">Spot Ocean : 84% Saved</text>
    </g>

    <!-- Node 3 -->
    <g class="node-3" transform="translate(880, 220)">
      <rect width="200" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="6" fill="#a855f7"/>
      <text x="40" y="28" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">Karpenter : Dynamic Provision</text>
    </g>
  </g>

  <!-- Animated Flow Lines in Background -->
  <path d="M 100,280 L 1100,280" stroke="#38bdf8" stroke-width="2" class="flow-line" opacity="0.2"/>

  <!-- Main Content Overlay (Guaranteed Foreground Visibility) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 55)">
      <rect width="260" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="18" class="badge-text">⚡ CLOUD INFRASTRUCTURE &amp; FINOPS</text>
    </g>

    <!-- Foreground Main Title -->
    <text x="0" y="130" class="title">Awesome Cloud Auto-Scaling</text>
    <text x="0" y="175" class="title" fill="#38bdf8">&amp; Capacity Management 📈⚙️</text>

    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle">Curated directory of Kubernetes autoscalers, FinOps rightsizing, Spot orchestrators &amp; capacity tools.</text>

    <!-- Subtext Tech Tags -->
    <g transform="translate(0, 252)">
      <text font-family="sans-serif" font-size="13" fill="#64748b" font-weight="500">
        <tspan fill="#38bdf8">●</tspan> Kubernetes HPA/VPA/KEDA  
        <tspan fill="#818cf8" dx="15">●</tspan> Spot Instance Management  
        <tspan fill="#c084fc" dx="15">●</tspan> FinOps Rightsizing  
        <tspan fill="#10b981" dx="15">●</tspan> Open-Source &amp; Commercial
      </text>
    </g>
  </g>
</svg>
